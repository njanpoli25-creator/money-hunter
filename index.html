    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 18%, rgba(212,175,55,.16), transparent 25%),
                radial-gradient(circle at 12% 75%, rgba(0,255,110,.12), transparent 28%),
                radial-gradient(circle at 88% 55%, rgba(212,175,55,.10), transparent 25%),
                linear-gradient(135deg, #020202 0%, #07120b 42%, #010101 100%);
            background-attachment: fixed;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .12;
            background-image:
                radial-gradient(rgba(255,255,255,.55) .6px, transparent .7px);
            background-size: 7px 7px;
            mix-blend-mode: soft-light;
        }

        /* Rich background glow */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% -10%, rgba(255,255,255,.07), transparent 34%),
                linear-gradient(120deg, transparent 48%, rgba(212,175,55,.08) 49%, transparent 50%),
                linear-gradient(300deg, transparent 48%, rgba(212,175,55,.06) 49%, transparent 50%);
            opacity: .85;
        }

        .page {
            width: min(1100px, 92%);
            margin: auto;
            padding: 45px 0 35px;
            text-align: center;
        }

        /* Logo */
        .logo {
            width: 210px;
            height: 210px;
            margin: 0 auto 25px;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle, #07160b 55%, #020804 56%);
            
            border: 3px solid #d7b84b;
            box-shadow:
                0 0 20px #00ff66,
                0 0 55px rgba(0,255,100,.35),
                inset 0 0 25px rgba(255,210,70,.25);
            
            animation: glow 2.5s infinite alternate;
        }

        .logo::before {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            border: 2px dashed #d7b84b;
        }

        .dollar {
            font-size: 105px;
            font-family: Georgia, serif;
            color: #f5d66b;
            text-shadow:
                0 0 8px #fff2a5,
                0 0 20px #d7a900;
            z-index: 2;
        }

        .crown {
            position: absolute;
            top: 25px;
            font-size: 42px;
            color: #ffd84d;
            filter: drop-shadow(0 0 8px #ffcf35);
            z-index: 3;
        }

        @keyframes glow {
            from {
                box-shadow:
                    0 0 15px #00ff66,
                    0 0 35px rgba(0,255,100,.25);
            }

            to {
                box-shadow:
                    0 0 30px #00ff66,
                    0 0 70px rgba(0,255,100,.45);
            }
        }

        /* Heading */
        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(48px, 8vw, 92px);
            letter-spacing: 5px;
            line-height: .95;
            color: #f5f5f5;
            text-shadow: 0 5px 15px #000;
        }

        h1 span {
            display: block;
            color: #54ff6b;
            text-shadow:
                0 0 8px #36ff56,
                0 0 25px rgba(0,255,70,.5);
        }

        .subtitle {
            margin-top: 20px;
            color: #eee;
            font-size: 16px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .divider {
            width: 270px;
            height: 2px;
            margin: 25px auto;
            background: linear-gradient(
                90deg,
                transparent,
                #f5c94c,
                transparent
            );
            box-shadow: 0 0 12px #f5c94c;
        }

        /* CTA */
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;

            width: min(620px, 95%);
            padding: 20px 30px;

            border-radius: 22px;
            border: 2px solid #b9ff72;

            background:
                linear-gradient(
                    180deg,
                    #25df62,
                    #078c36
                );

            color: white;
            font-size: 23px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: 1px;

            box-shadow:
                0 0 15px rgba(0,255,80,.7),
                inset 0 0 15px rgba(255,255,255,.2);

            transition: .25s;
        }

        .telegram-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow:
                0 0 25px rgba(0,255,80,.9),
                0 10px 35px rgba(0,0,0,.5);
        }

        .telegram-icon {
            font-size: 32px;
        }

        .arrow {
            font-size: 30px;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
            margin-top: 65px;
        }

        .card {
            min-height: 230px;
            padding: 30px 15px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(9,40,20,.95),
                    rgba(1,13,6,.95)
                );

            border: 1px solid #a98521;

            box-shadow:
                0 0 18px rgba(0,255,80,.12),
                inset 0 0 25px rgba(212,175,55,.05);

            position: relative;
            overflow: hidden;
        }

        .card::after {
            content: "";
            position: absolute;
            bottom: 18px;
            left: 25%;
            width: 50%;
            height: 2px;

            background: #e8bd38;
            box-shadow: 0 0 12px #e8bd38;
        }

        .card-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            border: 2px solid #e8c34d;

            font-size: 34px;

            box-shadow:
                0 0 12px rgba(255,205,60,.3),
                inset 0 0 15px rgba(255,205,60,.08);
        }

        .number {
            font-size: 40px;
            font-weight: 800;
            color: white;
        }

        .card-title {
            margin-top: 5px;
            font-size: 19px;
            letter-spacing: 3px;
            color: #45ff68;
            font-weight: 700;
        }

        .bottom-text {
            margin-top: 50px;
            color: #e9c84c;
            letter-spacing: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Decorative floating particles */
        .particle {
            position: fixed;
            width: 5px;
            height: 5px;
            background: #eac54d;
            border-radius: 50%;
            box-shadow: 0 0 12px #eac54d;
            animation: float 5s infinite ease-in-out;
            opacity: .7;
        }

        .p1 { left: 10%; top: 20%; }
        .p2 { right: 15%; top: 35%; animation-delay: 1s; }
        .p3 { left: 20%; bottom: 15%; animation-delay: 2s; }
        .p4 { right: 8%; bottom: 25%; animation-delay: 3s; }

        @keyframes float {
            0%,100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-25px);
            }
        }

        /* Mobile */
        @media (max-width: 700px) {

            .page {
                padding-top: 30px;
            }

            .logo {
                width: 160px;
                height: 160px;
            }

            .dollar {
                font-size: 80px;
            }

            .crown {
                font-size: 32px;
                top: 18px;
            }

            .subtitle {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .telegram-btn {
                font-size: 17px;
                padding: 17px 15px;
            }

            .cards {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .card {
                min-height: 190px;
            }

            .bottom-text {
                letter-spacing: 4px;
            }
        }
    </style>
</head>

        </p>

        <div class="divider"></div>

            <span class="telegram-icon">➤</span>

        </a>

        <section class="cards">

            <div class="card">

            </div>

            <div class="card">

            </div>

            <div class="card">
                <div class="card-icon">✓</div>
                <div class="number">FREE</div>
                <div class="card-title">TO JOIN</div>
            </div>

        </section>

        <div class="bottom-text">
            LEARN • EARN • GROW
        </div>

    </main>

</body>
</html>
